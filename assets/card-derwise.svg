  <text x="28" y="140" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">and assignments through built-in video calls.</text>
