<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-label="Derwise — Co-creator · Flutter Developer">
  <title>Derwise — Co-creator · Flutter Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121b36"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="c"><rect width="580" height="230" rx="18"/></clipPath>
  </defs>
  <style>
    .glow { animation: glow 8s ease-in-out infinite alternate; }
    @keyframes glow { from { transform: translate(0,0); } to { transform: translate(-60px,30px); } }
