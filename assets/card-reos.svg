    <circle class="glow" cx="520" cy="30" r="110" fill="#a78bfa" opacity="0.35" filter="url(#blur)"/>
    <rect class="bar" width="580" height="4" fill="url(#ac)"/>
  </g>
  <rect x="0.5" y="0.5" width="579" height="229" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
