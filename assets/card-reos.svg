    <g transform="translate(389,180)"><rect width="37" height="26" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="18.5" y="17.5" text-anchor="middle" fill="#e2e8f0">AI</text></g>
